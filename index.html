              type:"button", class:"row-menu", tabindex:"-1", "aria-hidden":"true",
              title:"Actions for this idea",
              onclick: e => { e.preventDefault(); e.stopPropagation(); focusId = node.id; openNodeMenu(node.id, b); }
            }, "\u22EF");
            return b;
          })()
        );

    return el("li", { class:"item", role: isPrimary ? "none" : null },
      row,
      kids.length && !node.collapsed
        ? el("ul", { role: isPrimary ? "group" : null }, kids.map(itemFor))
        : null
    );
  }

  return el("section", {
    class:"pane pane-outline", "aria-label":"Outline",
    style: view === "both" ? "flex-basis:" + outlineW + "px" : "flex:1 1 auto"
  },
    el("div", { class:"panehead" },
      el("h2", { text:"Outline" }),
      el("span", { class:"grow" }),
      view === "both"
        ? el("button", { class:"btn", onclick:hideOutline }, "Hide",
            el("span", { class:"sr-only" }, " the outline"))
        : null
    ),
    el("ul", {
      class:"tree",
      role: isPrimary ? "tree" : null,
      "aria-label": isPrimary ? "Ideas" : null,
      "aria-hidden": isPrimary ? null : "true"
    }, itemFor(map.nodes[map.rootId])),
    el("p", { class:"colorname", style:"margin-top:1rem" },
      list.length + (list.length === 1 ? " idea shown." : " ideas shown.") + " Press ? for keyboard help.")
  );
}

/* ------------------------------------------ map pane (a picture of the tree) */
/* Pan and zoom are a transform on the canvas, not scrollbars, so the map can
   extend in any direction and coordinates are free to go negative. */
let zoom = 1, panX = 0, panY = 0;
/* 2.5.7 Dragging Movements. Everything reachable by dragging is also
   reachable with plain clicks: "Move to a spot" picks a cloud up and the
   next click puts it down, and the pan buttons move the view. A keyboard
   path does not satisfy this criterion, which is why these exist even
   though Alt plus the arrow keys already covers the meaningful moves. */
let placing = null;        // id of the cloud currently being moved
let placeOrigin = null;   // where it sat when the move started, so Escape can undo

function nudgePan(dx, dy){
  panX += dx; panY += dy;
  render();
  say("Map moved " + (dx > 0 ? "right" : dx < 0 ? "left" : dy > 0 ? "down" : "up") + ".");
}
function startPlacing(id){
  const node = currentMap().nodes[id];
  placing = id;
  placeOrigin = { x: node.x, y: node.y };
  focusId = id;
  pendingFocus = '[data-node-id="' + id + '"]';
  render();
  say("Moving " + node.label + ". Use the arrow keys to nudge it, or click where you want it. " +
      "Enter to drop it, Escape to put it back.");
}
/* Arrow keys nudge the cloud instead of walking the tree while a move is in
   progress. That makes the move finishable without a pointer, which the
   click-to-place version on its own was not. Holding Shift moves in smaller
   steps for lining things up. */
function nudgePlacing(dx, dy){
  const map = currentMap();
  const node = map.nodes[placing];
  if(!node) return;
  shiftBranch(map, placing, dx, dy);
  writeRecovery(map);
  pendingFocus = '[data-node-id="' + placing + '"]';
  render();
}
function confirmPlacing(){
  if(!placing) return;
  const map = currentMap();
  const label = map.nodes[placing].label;
  placing = null; placeOrigin = null;
  pendingFocus = '[data-node-id="' + focusId + '"]';
  commit(label + " dropped. Its place in the outline has not changed.");
}
function cancelPlacing(quiet){
  if(!placing) return;
  const map = currentMap();
  const node = map.nodes[placing];
  if(node && placeOrigin){          // put it back exactly where it was
    shiftBranch(map, placing, placeOrigin.x - node.x, placeOrigin.y - node.y);
  }
  const id = placing;
  placing = null; placeOrigin = null;
  pendingFocus = '[data-node-id="' + id + '"]';
  render();
  if(!quiet) say("Move canceled. Put back where it was.");
}
function placeAt(clientX, clientY, scroll){
  const map = currentMap();
  const id = placing;
  const node = map.nodes[id];
  if(!node){ placing = null; return; }
  const r = scroll.getBoundingClientRect();
  const wantX = (clientX - r.left - r.width / 2 - panX) / zoom;
  const wantY = (clientY - r.top - r.height / 2 - panY) / zoom;
  shiftBranch(map, id, wantX - node.x, wantY - node.y);
  placing = null; placeOrigin = null;
  focusId = id;
  pendingFocus = '[data-node-id="' + id + '"]';
  commit(node.label + " moved. Its place in the outline has not changed.");
}

function renderMapPane(map, isPrimary){
  const { pos, minX, minY, width, height } = layout(map);
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("width", width);
  svg.setAttribute("height", height);
  svg.setAttribute("viewBox", minX + " " + minY + " " + width + " " + height);
  svg.setAttribute("aria-hidden", "true");
  svg.setAttribute("focusable", "false");
  svg.style.left = minX + "px";
  svg.style.top = minY + "px";

  const list = visibleList(map);
  const paths = {};
  list.forEach(n => {
    if(!n.parentId || !pos[n.parentId]) return;
    const path = document.createElementNS(svgNS, "path");
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", colorOf(n.color).line);
    path.setAttribute("stroke-linecap", "round");
    // Branches thin out as they go, the way a real mind map reads.
    path.setAttribute("stroke-width", String(Math.max(1.5, 5 - depthOf(map, n.id))));
    path.setAttribute("d", curve(pos[n.parentId], pos[n.id]));
    paths[n.id] = path;
    svg.append(path);
  });

  const nodeEls = {};
  const boxes = [];
  list.forEach(n => {
    const c = colorOf(n.color);
    const kids = childrenOf(map, n.id);
    const isCurrent = n.id === focusId;

    // Renaming happens where you are. The map gets its own editor so that
    // Shift+Enter never yanks you into a different view mid-thought.
    if(editingId === n.id && editingPane === "map"){
      boxes.push(el("input", {
        class:"map-edit", id:"inline-edit", value:n.label, "aria-label":"Rename idea",
        style:"left:" + pos[n.id].x + "px;top:" + pos[n.id].y + "px",
        onpointerdown: e => e.stopPropagation(),
        onkeydown: e => {
          if(e.key === "Enter"){ e.preventDefault(); finishEdit(e.target.value); }
          else if(e.key === "Escape"){ e.preventDefault(); cancelEdit(); }
        },
        onblur: e => { if(editingId === n.id) finishEdit(e.target.value); }
      }));
      return;
    }

    const stop = e => e.stopPropagation();
    const menuBtn = el("button", {
      type:"button", class:"node-menu", tabindex:"-1", "aria-hidden":"true",
      style:"border-color:" + c.line + ";color:" + c.line,
      title:"Actions for this idea",
      onpointerdown: stop,
      onclick: e => { e.preventDefault(); stop(e); openNodeMenu(n.id, menuBtn); }
    }, "\u22EF");
    const addBtn = el("button", {
      type:"button", class:"node-add", tabindex:"-1", "aria-hidden":"true",
      style:"border-color:" + c.line + ";color:" + c.line,
      title:"Add a sub-idea",
      onpointerdown: stop,
      onclick: e => { e.preventDefault(); stop(e); addChildAndEdit(n.id, "map"); }
    }, "+");

    const box = el("button", {
      type:"button",
      class:"node" + (isCurrent ? " is-current" : "") + (placing === n.id ? " is-moving" : "") + (n.id === map.rootId ? " is-root" : "")
        + (kids.length ? "" : " is-leaf"),
      style:"left:" + pos[n.id].x + "px;top:" + pos[n.id].y + "px;background:" + c.fill + ";border-color:" + c.line,
      role: isPrimary ? "treeitem" : null,
      "aria-level": isPrimary ? depthOf(map, n.id) + 1 : null,
      "aria-expanded": isPrimary && kids.length ? (n.collapsed ? "false" : "true") : null,
      "aria-selected": isPrimary ? (isCurrent ? "true" : "false") : null,
      "aria-label": isPrimary ? accessibleName(map, n) : null,
      tabindex: isPrimary ? (isCurrent ? "0" : "-1") : "-1",
      "data-node-id": isPrimary ? n.id : null,
      onclick: e => {
        e.preventDefault();
        if(box.dataset.dragged === "1"){ delete box.dataset.dragged; return; }
        focusId = n.id;
        pendingFocus = isPrimary ? '[data-node-id="' + n.id + '"]' : null;
        render();
      },
      ondblclick: () => startEdit(n.id, "map"),
      oncontextmenu: e => { e.preventDefault(); focusId = n.id; openNodeMenu(n.id, box); },
      onkeydown: isPrimary ? onTreeKey : null,
      onpointerdown: e => { if(!placing) beginDrag(e, map, n, pos, nodeEls, paths, box); }
    },
      el("span", { class:"glyph", "aria-hidden":"true", style:"color:" + c.line }, c.glyph),
      el("span", { class:"ntext" }, n.label,
        kids.length && n.collapsed ? el("span", { class:"kids" }, " (+" + kids.length + ")") : null),
      menuBtn, addBtn
    );
    nodeEls[n.id] = box;
    boxes.push(box);
  });

  const canvas = el("div", {
    class:"canvas",
    style:"transform:translate(" + panX + "px," + panY + "px) scale(" + zoom + ")",
    role: isPrimary ? "tree" : null,
    "aria-label": isPrimary ? "Ideas" : null,
    "aria-hidden": isPrimary ? null : "true"
  });
  canvas.append(svg, ...boxes);

  const scroll = el("div", {
    class:"mapscroll" + (placing ? " is-placing" : ""),
    onclick: e => { if(placing) placeAt(e.clientX, e.clientY, scroll); },
    onpointerdown: e => { if(!placing) beginPan(e, scroll); },
    onwheel: e => {
      e.preventDefault();
      if(e.ctrlKey || e.metaKey){
        setZoom(zoom * (e.deltaY > 0 ? 0.92 : 1.08), e, scroll);
      }else{
        panX -= e.deltaX; panY -= e.deltaY;
        canvas.style.transform = "translate(" + panX + "px," + panY + "px) scale(" + zoom + ")";
      }
    }
  }, canvas);

  return el("section", { class:"mapwrap", "aria-label":"Map" },
    el("div", { class:"mapbar" },
      el("span", { class:"label" }, "Map"),
      view === "map" ? el("button", { class:"btn", onclick:showOutline }, "Show outline") : null,
      el("span", { class:"grow" }),
      el("span", { class:"colorname" },
        placing ? "Arrow keys to nudge, Enter to drop, Escape to put it back." : "Drag an idea, or use its menu to move it without dragging."),
      el("div", { class:"group", role:"group", "aria-label":"Move the view" },
        el("button", { class:"btn btn-pan", title:"Move view left", onclick:() => nudgePan(140, 0) }, "\u2190"),
        el("button", { class:"btn btn-pan", title:"Move view up", onclick:() => nudgePan(0, 140) }, "\u2191"),
        el("button", { class:"btn btn-pan", title:"Move view down", onclick:() => nudgePan(0, -140) }, "\u2193"),
        el("button", { class:"btn btn-pan", title:"Move view right", onclick:() => nudgePan(-140, 0) }, "\u2192")
      ),
      el("button", { class:"btn", title:"Zoom out", onclick:() => setZoom(zoom - 0.1) }, "\u2212"),
      el("span", { class:"colorname", style:"min-width:3.2rem;text-align:center" }, Math.round(zoom * 100) + "%"),
      el("button", { class:"btn", title:"Zoom in", onclick:() => setZoom(zoom + 0.1) }, "+"),
      el("button", { class:"btn", onclick:() => { panX = 0; panY = 0; zoom = 1; render(); say("Map recentered."); } }, "Recenter")
    ),
    scroll
  );
}

function setZoom(next){
  zoom = Math.min(1.6, Math.max(0.4, Math.round(next * 20) / 20));
  render();
  say("Zoom " + Math.round(zoom * 100) + " percent.");
}

function curve(a, b){
  // Organic S-curve rather than an elbow, so branches read as growth.
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  const dx = b.x - a.x, dy = b.y - a.y;
  const bend = 0.16;
  return "M " + a.x + " " + a.y +
         " Q " + (mx - dy * bend) + " " + (my + dx * bend) + " " + b.x + " " + b.y;
}

/* Dragging the background moves the viewport, not the map. Nothing in the
   model changes, so there is nothing for a keyboard user to miss. */
function beginPan(e, scroll){
  if(e.target !== scroll && !e.target.classList.contains("canvas")) return;
  const startX = e.clientX, startY = e.clientY, px = panX, py = panY;
  const canvas = scroll.querySelector(".canvas");
  scroll.classList.add("is-panning");
  const onMove = ev => {
    panX = px + (ev.clientX - startX);
    panY = py + (ev.clientY - startY);
    canvas.style.transform = "translate(" + panX + "px," + panY + "px) scale(" + zoom + ")";
  };
  const onUp = () => {
    scroll.classList.remove("is-panning");
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("pointerup", onUp);
    window.removeEventListener("pointercancel", onUp);
  };
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
  window.addEventListener("pointercancel", onUp);
}

/* Drag updates the DOM directly and only writes to the model on release, so
   moving a big branch stays smooth and produces one change rather than fifty. */
function beginDrag(e, map, node, pos, nodeEls, paths, box){
  if(e.button !== 0 && e.pointerType === "mouse") return;
  e.stopPropagation();
  const startX = e.clientX, startY = e.clientY;
  const moving = [node.id, ...descendants(map, node.id).map(n => n.id)].filter(id => pos[id]);
  const origin = {};
  moving.forEach(id => { origin[id] = { x: pos[id].x, y: pos[id].y }; });
  let moved = false;

  const onMove = ev => {
    const dx = (ev.clientX - startX) / zoom, dy = (ev.clientY - startY) / zoom;
    if(!moved && Math.abs(dx) + Math.abs(dy) < 3) return;
    if(!moved){
      moved = true;
      box.classList.add("is-dragging");
      if(box.setPointerCapture) try{ box.setPointerCapture(ev.pointerId); }catch(err){}
    }
    moving.forEach(id => {
      pos[id].x = origin[id].x + dx;
      pos[id].y = origin[id].y + dy;
      if(nodeEls[id]){ nodeEls[id].style.left = pos[id].x + "px"; nodeEls[id].style.top = pos[id].y + "px"; }
    });
    Object.keys(paths).forEach(id => {
      const p = map.nodes[id];
      if(p && pos[id] && pos[p.parentId]) paths[id].setAttribute("d", curve(pos[p.parentId], pos[id]));
    });
  };
  const onUp = ev => {
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("pointerup", onUp);
    window.removeEventListener("pointercancel", onUp);
    box.classList.remove("is-dragging");
    if(!moved) return;
    box.dataset.dragged = "1";            // stop the click handler firing after a drag
    const dx = (ev.clientX - startX) / zoom, dy = (ev.clientY - startY) / zoom;
    shiftBranch(map, node.id, dx, dy);
    focusId = node.id;
    pendingFocus = '[data-node-id="' + node.id + '"]';
    commit(node.label + " moved. Its place in the outline has not changed.");
  };
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
  window.addEventListener("pointercancel", onUp);
}

/* ------------------------------------------------------------ interactions */
function toggle(id){
  const map = currentMap();
  const node = map.nodes[id];
  if(!childrenOf(map, id).length) return;
  node.collapsed = !node.collapsed;
  focusId = id;
  pendingFocus = '[data-node-id="'+id+'"]';
  commit(node.collapsed ? "Collapsed " + node.label + "." : "Expanded " + node.label + ".");
}
let editingPane = "outline";   // which pane owns the open editor

/* Outline width. Kept in the tab, like the recovery copy, so it dies when the
   tab closes and never becomes something left behind on a shared computer. */
const WIDTH_KEY = "a11y-mindmap:outline-width";
const MIN_W = 220, MAX_W = 640, DEFAULT_W = 380;
let outlineW = (function(){
  const n = parseInt(sessionStorage.getItem(WIDTH_KEY) || "", 10);
  return (n >= MIN_W && n <= MAX_W) ? n : DEFAULT_W;
})();
function setOutlineW(px, quiet){
  outlineW = Math.round(Math.min(MAX_W, Math.max(MIN_W, px)));
  try{ sessionStorage.setItem(WIDTH_KEY, String(outlineW)); }catch(e){}
  if(!quiet) say("Outline " + outlineW + " pixels wide.");
}

function startEdit(id, pane){
  editingId = id;
  editingPane = pane || (view === "map" ? "map" : "outline");
  focusId = id;
  pendingFocus = "#inline-edit";
  render();
}
function finishEdit(value){
  const map = currentMap();
  const id = editingId;
  editingId = null;
  if(!map || !map.nodes[id]) { render(); return; }
  map.nodes[id].label = (value || "").trim() || "Untitled idea";
  pendingFocus = '[data-node-id="'+id+'"]';
  commit("Renamed to " + map.nodes[id].label + ".");
}
function cancelEdit(){
  const id = editingId;
  editingId = null;
  pendingFocus = '[data-node-id="'+id+'"]';
  render();
  say("Rename canceled.");
}
function addChildAndEdit(parentId, pane){
  const map = currentMap();
  const node = addChild(map, parentId);
  if(!node) return;
  ensurePositions(map);
  focusId = node.id;
  editingId = node.id;
  editingPane = pane || (view === "map" ? "map" : "outline");
  pendingFocus = "#inline-edit";
  commit("Sub-idea added under " + map.nodes[parentId].label + ".");
}
function addSiblingAndEdit(id){
  const map = currentMap();
  const target = map.nodes[id];
  if(!target.parentId) return addChildAndEdit(id);
  const node = addChild(map, target.parentId);
  node.order = target.order + 0.5;
  resequence(map, target.parentId);
  ensurePositions(map);
  focusId = node.id;
  editingId = node.id;
  editingPane = view === "map" ? "map" : "outline";
  pendingFocus = "#inline-edit";
  commit("Idea added after " + target.label + ".");
}
function moveWithinSiblings(id, delta){
  const map = currentMap();
  const node = map.nodes[id];
  if(!node.parentId) return say("The central idea cannot be moved.");
  const sibs = childrenOf(map, node.parentId);
  const i = sibs.findIndex(s => s.id === id);
  const j = i + delta;
  if(j < 0 || j >= sibs.length) return say("Already " + (delta < 0 ? "first" : "last") + " among its siblings.");
  sibs.splice(j, 0, sibs.splice(i, 1)[0]);
  sibs.forEach((s, k) => { s.order = k; });
  pendingFocus = '[data-node-id="'+id+'"]';
  commit("Moved " + (delta < 0 ? "up" : "down") + ". Now " + (j + 1) + " of " + sibs.length + ".");
}
function indent(id){
  const map = currentMap();
  const node = map.nodes[id];
  if(!node.parentId) return say("The central idea cannot be moved.");
  const sibs = childrenOf(map, node.parentId);
  const i = sibs.findIndex(s => s.id === id);
  if(i === 0) return say("Nothing above it to move under.");
  const newParent = sibs[i - 1];
  node.parentId = newParent.id;
  node.order = childrenOf(map, newParent.id).length;
  newParent.collapsed = false;
  resequence(map, sibs[0].parentId);
  pendingFocus = '[data-node-id="'+id+'"]';
  commit("Moved under " + newParent.label + ".");
}
function outdent(id){
  const map = currentMap();
  const node = map.nodes[id];
  const parent = node.parentId ? map.nodes[node.parentId] : null;
  if(!parent || !parent.parentId) return say("Already at the top level.");
  const grandparent = map.nodes[parent.parentId];
  const oldParentId = parent.id;
  node.parentId = grandparent.id;
  node.order = parent.order + 0.5;
  resequence(map, grandparent.id);
  resequence(map, oldParentId);
  pendingFocus = '[data-node-id="'+id+'"]';
  commit("Moved out to sit alongside " + parent.label + ".");
}
function deleteFocused(id){
  const map = currentMap();
  if(id === map.rootId) return say("The central idea cannot be deleted.");
  const node = map.nodes[id];
  const kids = descendants(map, id).length;
  const question = kids
    ? 'Delete "' + node.label + '" and its ' + kids + ' sub-' + (kids === 1 ? "idea" : "ideas") + "?"
    : 'Delete "' + node.label + '"?';
  if(!confirm(question)) return;

  // Land focus somewhere sensible rather than dumping the user at the top.
  const list = visibleList(map);
  const i = list.findIndex(n => n.id === id);
  const doomed = new Set([id, ...descendants(map, id).map(n => n.id)]);
  let next = null;
  for(let k = i + 1; k < list.length; k++) if(!doomed.has(list[k].id)){ next = list[k].id; break; }
  if(!next) for(let k = i - 1; k >= 0; k--) if(!doomed.has(list[k].id)){ next = list[k].id; break; }

  const n = removeNode(map, id);
  focusId = next || map.rootId;
  pendingFocus = '[data-node-id="'+focusId+'"]';
  commit(n === 1 ? "Idea deleted." : n + " ideas deleted.");
}

/* ---------------------------------------------------------- shortcut keys */
/* Each action answers to several key combinations rather than one, and none
   of them can be changed. That is deliberate.

   The problem being solved is that browsers, extensions and screen readers
   all claim key combinations, so any single choice is dead on someone's
   machine. Letting students rebind keys solves that but adds a capture
   handler, a stored preference, conflict checking and a migration path, four
   things that can break, to a tool whose whole point is being simple. Giving
   every action three or four spellings solves the same problem with none of
   that: if one is taken, another works. The Shortcuts panel includes a box
   for testing which ones reach the page, so a student can find out in
   seconds rather than guessing.

   Bindings are matched on e.code, the physical key, because on a Mac the
   Option key changes the character produced. Option and M does not report
   "m". */
const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent || "");

const ACTIONS = [
  { id:"menu",     label:"Open the actions menu",        keys:[{code:"KeyM",ctrl:true},{key:"Enter",alt:true},{code:"KeyM",alt:true},{key:"F10",shift:true},{key:"ContextMenu"}] },
  { id:"rename",   label:"Rename this idea",             keys:[{key:"Enter"},{key:"F2"}] },
  { id:"addChild", label:"Add a sub-idea underneath",    keys:[{key:"Enter",shift:true},{key:"Insert"}] },
  { id:"addSib",   label:"Add an idea alongside",        keys:[{key:"Enter",ctrl:true},{key:"Enter",meta:true}] },
  { id:"del",      label:"Delete this idea",             keys:[{key:"Delete"},{key:"Backspace"}] },
  { id:"moveUp",   label:"Move up past the idea above",  keys:[{key:"ArrowUp",alt:true}] },
  { id:"moveDown", label:"Move down past the one below", keys:[{key:"ArrowDown",alt:true}] },
  { id:"indent",   label:"Move under the idea above",    keys:[{key:"ArrowRight",alt:true}] },
  { id:"outdent",  label:"Move out one level",           keys:[{key:"ArrowLeft",alt:true}] },
  { id:"help",     label:"Open the shortcuts list",      keys:[{key:"?",shift:true},{key:"?"}] }
];


function matchBinding(e, b){
  if(!!b.ctrl !== e.ctrlKey) return false;
  if(!!b.alt !== e.altKey) return false;
  if(!!b.shift !== e.shiftKey) return false;
  if(!!b.meta !== e.metaKey) return false;
  return b.code ? e.code === b.code : e.key === b.key;
}
function matchAction(e){
  for(const a of ACTIONS) if(a.keys.some(b => matchBinding(e, b))) return a.id;
  return null;
}
function labelBinding(b){
  const parts = [];
  if(b.ctrl) parts.push("Ctrl");
  if(b.alt) parts.push(IS_MAC ? "Option" : "Alt");
  if(b.shift) parts.push("Shift");
  if(b.meta) parts.push(IS_MAC ? "Cmd" : "Win");
  let main = b.code
    ? b.code.replace(/^Key/, "").replace(/^Digit/, "").replace(/^Numpad/, "Num ")
    : b.key;
  main = ({ ArrowUp:"\u2191", ArrowDown:"\u2193", ArrowLeft:"\u2190", ArrowRight:"\u2192",
            " ":"Space", Escape:"Esc", ContextMenu:"Menu key", Delete:"Delete", Backspace:"Backspace" })[main] || main;
  parts.push(main.length === 1 ? main.toUpperCase() : main);
  return parts;
}
const actionOf = id => ACTIONS.find(a => a.id === id);
const firstBindingLabel = id => {
  const a = actionOf(id);
  return a && a.keys[0] ? labelBinding(a.keys[0]).join("+") : "";
};

function runAction(action, id, anchor){
  switch(action){
    case "menu":     return openNodeMenu(id, anchor);
    case "rename":   return startEdit(id, anchor && anchor.classList.contains("node") ? "map" : "outline");
    case "addChild": return addChildAndEdit(id, anchor && anchor.classList.contains("node") ? "map" : "outline");
    case "addSib":   return addSiblingAndEdit(id);
    case "del":      return deleteFocused(id);
    case "moveUp":   return moveWithinSiblings(id, -1);
    case "moveDown": return moveWithinSiblings(id, 1);
    case "indent":   return indent(id);
    case "outdent":  return outdent(id);
    case "help":     return openShortcuts();
  }
}

/* One handler serves both panes, so the keyboard behaves identically
   whichever one you are in. */
function onTreeKey(e){
  const map = currentMap();
  if(!map || editingId) return;
  const id = e.currentTarget.getAttribute("data-node-id");
  if(!id || !map.nodes[id]) return;
  const node = map.nodes[id];
  const list = visibleList(map);
  const i = list.findIndex(n => n.id === id);
  const go = target => {
    if(!target) return;
    focusId = target;
    pendingFocus = '[data-node-id="' + target + '"]';
    render();
  };
  const kids = childrenOf(map, id);

  // A move in progress takes the keyboard over completely, so the arrow keys
  // move the cloud rather than walking the tree. The mode is announced on
  // entry and has two obvious ways out.
  if(placing === id){
    const step = e.shiftKey ? 6 : 24;
    switch(e.key){
      case "ArrowUp":    e.preventDefault(); return nudgePlacing(0, -step);
      case "ArrowDown":  e.preventDefault(); return nudgePlacing(0, step);
      case "ArrowLeft":  e.preventDefault(); return nudgePlacing(-step, 0);
      case "ArrowRight": e.preventDefault(); return nudgePlacing(step, 0);
      case "Enter": case " ":
        e.preventDefault(); return confirmPlacing();
      case "Escape":
        e.preventDefault(); return cancelPlacing();
      default:
        return;   // let anything else fall through untouched
    }
  }

  // Rebindable actions win over the fixed navigation keys below.
  const action = matchAction(e);
  if(action){ e.preventDefault(); return runAction(action, id, e.currentTarget); }

  // Navigation is deliberately not rebindable: it is the tree pattern every
  // screen reader user already knows, and changing it would cost more than
  // any collision it could avoid.
  switch(e.key){
    case "ArrowDown":
      e.preventDefault(); return go(list[i + 1] ? list[i + 1].id : null);
    case "ArrowUp":
      e.preventDefault(); return go(list[i - 1] ? list[i - 1].id : null);
    case "ArrowRight":
      e.preventDefault();
      if(kids.length && node.collapsed) return toggle(id);
      if(kids.length) return go(kids[0].id);
      return say("No sub-ideas.");
    case "ArrowLeft":
      e.preventDefault();
      if(kids.length && !node.collapsed) return toggle(id);
      return node.parentId ? go(node.parentId) : say("This is the central idea.");
    case "Home":
      e.preventDefault(); return go(list[0].id);
    case "End":
      e.preventDefault(); return go(list[list.length - 1].id);
    default:
      return;
  }
}


/* ------------------------------------------------------------ file in, out */
function download(name, text, type){
  const blob = new Blob([text], { type: type || "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
const safeName = s => (s || "mindmap").replace(/[^\w\d\-. ]+/g, "").trim() || "mindmap";

function downloadMap(map){
  download(safeName(titleOf(map)) + ".mindmap.json", JSON.stringify({ format:"a11y-mindmap", version:1, map }, null, 2));
  if(map === openMap){ savedFingerprint = fingerprint(map); render(); }
  say("Map saved to a file.");
}
function downloadOutline(map){
  const lines = [];
  (function walk(id, depth){
    const n = map.nodes[id];
    lines.push("  ".repeat(depth) + "- " + n.label);
    childrenOf(map, id).forEach(c => walk(c.id, depth + 1));
  })(map.rootId, 0);
  download(safeName(titleOf(map)) + ".outline.md", "# " + titleOf(map) + "\n\n" + lines.join("\n") + "\n", "text/markdown");
  say("Outline saved to a file.");
}

/* ------------------------------------------------------------ print / PDF */
/* The reason this exists: a .mindmap.json file can only be read by this tool,
   which makes grading a chore and makes the work unreadable to anyone without
   it. A PDF previews inline in an LMS, can be annotated, and opens anywhere.
   Students keep the JSON to carry on working; the PDF is the thing handed in. */
function buildPrintView(map){
  const root = document.getElementById("print-root");
  const { pos, minX, minY, width, height } = layout(map);

  // Fit to the printable area of a portrait Letter page, height as well as
  // width, so a tall map is not cut off at the bottom.
  const PAGE_W = 700, PAGE_H = 820;
  const scale = Math.min(1, PAGE_W / width, PAGE_H / height);

  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("width", width);
  svg.setAttribute("height", height);
  svg.setAttribute("viewBox", minX + " " + minY + " " + width + " " + height);
  svg.style.position = "absolute";
  svg.style.left = minX + "px";
  svg.style.top = minY + "px";

  const all = visibleList(map);
  all.forEach(n => {
    if(!n.parentId || !pos[n.parentId]) return;
    const path = document.createElementNS(svgNS, "path");
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", colorOf(n.color).line);
    path.setAttribute("stroke-width", String(Math.max(1.2, 4 - depthOf(map, n.id))));
    path.setAttribute("d", curve(pos[n.parentId], pos[n.id]));
    svg.append(path);
  });

  const canvas = el("div", { class:"print-canvas",
    style:"width:" + width + "px;height:" + height + "px;" +
      "transform:scale(" + scale + ") translate(" + (-minX) + "px," + (-minY) + "px)" });
  canvas.append(svg);
  all.forEach(n => {
    const c = colorOf(n.color);
    canvas.append(el("div", {
      class:"print-node",
      style:"left:" + pos[n.id].x + "px;top:" + pos[n.id].y + "px;background:" + c.fill + ";border-color:" + c.line
    },
      el("span", { style:"color:" + c.line }, c.glyph),
      el("span", {}, n.label)
    ));
  });

  const outlineItem = node => {
    const c = colorOf(node.color);
    const kids = childrenOf(map, node.id);
    return el("li", {},
      el("div", { class:"print-row" },
        el("span", { class:"print-chip", style:"background:" + c.fill + ";border-color:" + c.line }, c.glyph),
        el("span", {}, node.label),
        el("span", { class:"print-colorname" }, c.name)
      ),
      kids.length ? el("ul", {}, kids.map(outlineItem)) : null
    );
  };

  root.replaceChildren(
    el("div", { class:"print-head" },
      el("h1", {}, titleOf(map)),
      el("div", { class:"meta" },
        (map.names ? map.names + "  \u00B7  " : "") +
        Object.keys(map.nodes).length + " ideas  \u00B7  " +
        new Date().toLocaleDateString())
    ),
    el("div", { class:"print-mapwrap",
      style:"width:" + Math.ceil(width * scale) + "px;height:" + Math.ceil(height * scale) +
            "px;position:relative;margin:0 auto" }, canvas),
    el("div", { class:"print-outline" },
      el("h2", {}, "Outline"),
      el("ul", {}, outlineItem(map.nodes[map.rootId])))
  );
}

function printMap(){
  const map = currentMap();
  if(!map) return;
  openDialog((panel, close) => {
    const input = el("input", {
      id:"print-names", class:"edit", style:"width:100%;margin:.3rem 0 .2rem",
      value: map.names || "", placeholder:"e.g. Sam, Priya, Alex"
    });
    const go = () => {
      map.names = input.value.trim();
      writeRecovery(map);
      close();
      buildPrintView(map);
      // Let the dialog finish tearing down before the print sheet opens.
      setTimeout(() => window.print(), 60);
    };
    panel.append(
      el("h2", { id:"dialog-title", text:"Print or save as PDF" }),
      el("p", { style:"color:var(--ink-soft)" },
        "This prints the map and the outline together. To hand it in, choose Save as PDF as the destination in the print box."),
      el("label", { for:"print-names", style:"font-weight:600" }, "Names to show at the top (optional)"),
      input,
      el("p", { class:"fineprint" },
        "Keep your .mindmap.json file too. The PDF cannot be reopened for editing; the map file can."),
      el("div", { class:"dialog-actions" },
        el("button", { class:"btn", onclick:close }, "Cancel"),
        el("button", { class:"btn btn-primary", onclick:go }, "Continue to print"))
    );
  });
}
window.addEventListener("afterprint", () => {
  const root = document.getElementById("print-root");
  if(root) root.replaceChildren();
});

function openImport(){
  const input = el("input", { type:"file", accept:".json,application/json", class:"sr-only" });
  input.addEventListener("change", () => {
    const file = input.files && input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const parsed = JSON.parse(String(reader.result));
        const result = importAny(parsed, file.name);
        if(!result){ alert("That file is not a mind map this tool recognizes."); return; }
        openMap = result.map;
        savedFingerprint = fingerprint(result.map);
        focusId = result.map.rootId;
        view = "both"; panX = 0; panY = 0; zoom = 1;
        pendingFocus = '[data-node-id="' + result.map.rootId + '"]';
        commit(result.report);
        if(result.notes.length) alert("Opened " + titleOf(result.map) + "\n\n" + result.notes.join("\n"));
      }catch(err){
        console.warn(err);
        alert("That file could not be read. It may not be valid JSON.");
      }
    };
    reader.readAsText(file);
  });
  document.body.append(input);
  input.click();
  setTimeout(() => input.remove(), 0);
}

function importAny(parsed, filename){
  if(parsed && parsed.format === "a11y-mindmap" && parsed.map){
    const map = migrate(parsed.map);
    map.id = uid();
    map.updatedAt = Date.now();
    return { map, report:"Map opened.", notes:[] };
  }
  if(parsed && Array.isArray(parsed.nodes) && Array.isArray(parsed.edges)){
    return convertFlowMap(parsed, filename);
  }
  return null;
}

/* Converts the existing React Flow export (positioned nodes plus directed
   edges) into an authored tree. This is the migration path: run it once,
   and from then on structure is stored rather than inferred.

   The interesting part is what it has to cope with, and every one of these
   is a real thing a student can currently produce:
     - more than one edge pointing at the same node
     - edges that loop back and create a cycle
     - nodes connected to nothing
     - several disconnected clusters with no single root                     */
function convertFlowMap(src, filename){
  const notes = [];
  const byId = {};
  src.nodes.forEach(n => {
    byId[n.id] = {
      id: n.id,
      label: (n.data && n.data.label) || "Untitled idea",
      hex: (n.data && n.data.color) || "",
      isRoot: !!(n.data && n.data.isRoot),
      x: (n.position && n.position.x) || 0,
      y: (n.position && n.position.y) || 0
    };
  });

  const outgoing = {};
  const incomingCount = {};
  let extraEdges = 0;
  src.edges.forEach(e => {
    if(!byId[e.source] || !byId[e.target]) return;
    (outgoing[e.source] = outgoing[e.source] || []).push(e.target);
    incomingCount[e.target] = (incomingCount[e.target] || 0) + 1;
    if(incomingCount[e.target] > 1) extraEdges++;
  });

  let rootId = (src.nodes.find(n => n.data && n.data.isRoot) || {}).id;
  if(!rootId) rootId = Object.keys(byId).find(id => !incomingCount[id]);
  if(!rootId) rootId = Object.keys(byId)[0];
  if(!rootId) return null;

  // Breadth-first from the root. First arrival wins, which drops the extra
  // edges and breaks any cycles without hanging.
  const parentOf = { [rootId]: null };
  const seen = new Set([rootId]);
  const queue = [rootId];
  while(queue.length){
    const cur = queue.shift();
    const kids = (outgoing[cur] || []).slice().sort((a, b) =>
      (byId[a].y - byId[b].y) || (byId[a].x - byId[b].x));
    kids.forEach(k => {
      if(seen.has(k)) return;
      seen.add(k);
      parentOf[k] = cur;
      queue.push(k);
    });
  }

  const stranded = Object.keys(byId).filter(id => !seen.has(id));
  stranded
    .sort((a, b) => (byId[a].y - byId[b].y) || (byId[a].x - byId[b].x))
    .forEach(id => { parentOf[id] = rootId; seen.add(id); });

  // Nearest color by hue, so imported maps keep their look while every
  // node lands on a fill that actually passes contrast.
  const hueOf = hex => {
    const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || ""));
    if(!m) return null;
    const v = parseInt(m[1], 16);
    const r = ((v >> 16) & 255) / 255, g = ((v >> 8) & 255) / 255, b = (v & 255) / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    if(d < 0.20) return null;                       // gray enough to be slate
    let h;
    if(max === r) h = ((g - b) / d) % 6;
    else if(max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
    return h < 0 ? h + 360 : h;
  };
  const hexToColorId = hex => {
    const h = hueOf(hex);
    if(h === null) return "slate";
    let best = "slate", bestD = Infinity;
    COLORS.forEach(c => {
      if(c.id === "slate") return;                  // slate is the gray fallback, not a hue
      const ch = hueOf(c.line);
      if(ch === null) return;
      const d = Math.min(Math.abs(h - ch), 360 - Math.abs(h - ch));
      if(d < bestD){ bestD = d; best = c.id; }
    });
    return best;
  };

  const map = {
    id: uid(),
    createdAt: Date.now(),
    updatedAt: Date.now(),
    rootId,
    nodes: {}
  };
  Object.keys(byId).forEach(id => {
    map.nodes[id] = {
      id,
      label: byId[id].label,
      parentId: parentOf[id] === undefined ? rootId : parentOf[id],
      order: 0,
      color: hexToColorId(byId[id].hex),
      collapsed: false
    };
  });
  map.nodes[rootId].parentId = null;
  if(!byId[rootId].label || byId[rootId].label === "Untitled idea"){
    map.nodes[rootId].label = src.title || filename.replace(/\.json$/i, "") || "Imported map";
  }

  // Sibling order comes from the old on-screen positions, top to bottom.
  const groups = {};
  Object.values(map.nodes).forEach(n => { (groups[n.parentId] = groups[n.parentId] || []).push(n); });
  Object.values(groups).forEach(g => {
    g.sort((a, b) => (byId[a.id].y - byId[b.id].y) || (byId[a.id].x - byId[b.id].x));
    g.forEach((n, i) => { n.order = i; });
  });

  const count = Object.keys(map.nodes).length;
  if(stranded.length) notes.push(stranded.length + " idea(s) were not connected to the central idea. They have been attached to it so nothing was lost.");
  if(extraEdges) notes.push(extraEdges + " extra connection(s) were dropped. A tree gives each idea one parent; those links were cross-references, not parents.");
  if(!src.nodes.some(n => n.data && n.data.isRoot)) notes.push("No central idea was marked in the file, so the first idea with nothing pointing at it was used.");
  notes.push("Sibling order was taken from where the boxes sat on screen, top to bottom. Check it reads the way you expect.");

  return { map, report: "Imported " + count + " ideas.", notes };
}

/* ------------------------------------------------------------- bar menus */
/* Grouping the file and help commands behind two buttons is what gets the
   toolbar onto one line. It also keeps the number of things competing for
   attention small, which matters more than the line count. */
function openBarMenu(anchor, label, entries){
  if(closeMenu) closeMenu();
  const menu = el("div", { class:"menu", role:"menu", "aria-label":label });

  const items = () => [...menu.querySelectorAll('[role="menuitem"]')].filter(b => !b.disabled);
  function close(restore){
    document.getElementById("menu-root").replaceChildren();
    document.removeEventListener("keydown", onKey, true);
    document.removeEventListener("pointerdown", onOutside, true);
    closeMenu = null;
    anchor.setAttribute("aria-expanded", "false");
    if(restore !== false && anchor.focus) anchor.focus();
  }
  function onOutside(e){ if(!menu.contains(e.target) && e.target !== anchor) close(true); }
  function onKey(e){
    const list = items(), i = list.indexOf(document.activeElement);
    if(e.key === "Escape"){ e.preventDefault(); e.stopPropagation(); return close(true); }
    if(e.key === "Tab"){ e.preventDefault(); return close(true); }
    if(e.key === "ArrowDown"){ e.preventDefault(); return (list[i + 1] || list[0]).focus(); }
    if(e.key === "ArrowUp"){ e.preventDefault(); return (list[i - 1] || list[list.length - 1]).focus(); }
    if(e.key === "Home"){ e.preventDefault(); return list[0].focus(); }
    if(e.key === "End"){ e.preventDefault(); return list[list.length - 1].focus(); }
  }

  entries.forEach(entry => {
    if(entry === "-"){ menu.append(el("hr", {})); return; }
    menu.append(el("button", {
      type:"button", role:"menuitem", tabindex:"-1",
      onclick: () => { close(false); entry.run(); }
    }, el("span", {}, entry.label), entry.note ? el("span", { class:"keys" }, entry.note) : null));
  });

  document.getElementById("menu-root").replaceChildren(menu);
  const r = anchor.getBoundingClientRect();
  menu.style.left = Math.max(8, Math.min(r.left, window.innerWidth - menu.offsetWidth - 12)) + "px";
  menu.style.top = Math.min(r.bottom + 6, window.innerHeight - menu.offsetHeight - 12) + "px";
  document.addEventListener("keydown", onKey, true);
  document.addEventListener("pointerdown", onOutside, true);
  closeMenu = close;
  anchor.setAttribute("aria-expanded", "true");
  const first = items()[0];
  if(first) first.focus();
}

function barMenuButton(label, entries){
  const b = el("button", {
    class:"btn", "aria-haspopup":"menu", "aria-expanded":"false",
    onclick: () => openBarMenu(b, label, entries)
  }, label, el("span", { class:"caret", "aria-hidden":"true" }, "\u25BE"));
  return b;
}

/* ---------------------------------------------------------- actions menu */
/* One menu, both panes. The "..." triggers are mouse-only and hidden from
   assistive tech, because a treeitem must not contain its own focus stops.
   Keyboard users open the identical menu with Shift+F10 or the Menu key,
   which is the convention screen reader users already expect. Nothing here
   is reachable by one input method and not the other. */
let closeMenu = null;

function openNodeMenu(id, anchor){
  if(closeMenu) closeMenu();
  const map = currentMap();
  const node = map.nodes[id];
  if(!node) return;

  const isRoot = id === map.rootId;
  const sibs = node.parentId ? childrenOf(map, node.parentId) : [];
  const at = sibs.findIndex(s => s.id === id);
  const parent = node.parentId ? map.nodes[node.parentId] : null;
  const kids = childrenOf(map, id);

  const menuPane = anchor && anchor.closest && anchor.closest(".mapwrap") ? "map" : "outline";
  const menu = el("div", { class:"menu", role:"menu", "aria-label":"Actions for " + node.label });
  const run = fn => { close(false); fn(); };

  const item = (label, keys, fn, disabled) => el("button", {
    type:"button", role:"menuitem", tabindex:"-1", disabled: disabled ? true : null,
    onclick: () => { if(!disabled) run(fn); }
  }, el("span", {}, label), keys ? el("span", { class:"keys" }, keys) : null);

  menu.append(
    item("Rename", firstBindingLabel("rename"), () => startEdit(id, menuPane)),
    item("Add sub-idea", firstBindingLabel("addChild"), () => addChildAndEdit(id, menuPane)),
    item("Add alongside", firstBindingLabel("addSib"), () => addSiblingAndEdit(id), isRoot),
    el("hr", {}),
    item("Move this idea", "arrows or click", () => startPlacing(id)),
    el("hr", {}),
    item(kids.length && node.collapsed ? "Expand" : "Collapse", null, () => toggle(id), !kids.length),
    item("Move up", firstBindingLabel("moveUp"), () => moveWithinSiblings(id, -1), isRoot || at <= 0),
    item("Move down", firstBindingLabel("moveDown"), () => moveWithinSiblings(id, 1), isRoot || at < 0 || at >= sibs.length - 1),
    item("Move under the idea above", firstBindingLabel("indent"), () => indent(id), isRoot || at <= 0),
    item("Move out one level", firstBindingLabel("outdent"), () => outdent(id), isRoot || !parent || !parent.parentId),
    el("hr", {}),
    el("p", { class:"grouplabel", id:"menu-color-label" }, "Color"),
    el("div", { role:"group", "aria-labelledby":"menu-color-label" },
      COLORS.map(c => el("button", {
        type:"button", role:"menuitemradio", tabindex:"-1",
        "aria-checked": node.color === c.id ? "true" : "false",
        onclick: () => run(() => {
          map.nodes[id].color = c.id;
          pendingFocus = '[data-node-id="' + id + '"]';
          commit("Color changed to " + c.name + ".");
        })
      },
        el("span", { class:"swatch", "aria-hidden":"true", style:"background:" + c.fill + ";border-color:" + c.line }, c.glyph),
        el("span", {}, c.name),
        node.color === c.id ? el("span", { class:"tick", "aria-hidden":"true" }, "\u2713") : null
      ))
    ),
    el("hr", {}),
    item("Delete", firstBindingLabel("del"), () => deleteFocused(id), isRoot)
  );

  const items = () => [...menu.querySelectorAll('[role="menuitem"],[role="menuitemradio"]')].filter(b => !b.disabled);

  function close(restoreFocus){
    document.getElementById("menu-root").replaceChildren();
    document.removeEventListener("keydown", onKey, true);
    document.removeEventListener("pointerdown", onOutside, true);
    closeMenu = null;
    if(restoreFocus !== false){
      const back = document.querySelector('[data-node-id="' + id + '"]');
      if(back) back.focus();
    }
  }
  function onOutside(e){ if(!menu.contains(e.target)) close(true); }
  function onKey(e){
    const list = items();
    const i = list.indexOf(document.activeElement);
    if(e.key === "Escape"){ e.preventDefault(); e.stopPropagation(); return close(true); }
    if(e.key === "Tab"){ e.preventDefault(); return close(true); }
    if(e.key === "ArrowDown"){ e.preventDefault(); return (list[i + 1] || list[0]).focus(); }
    if(e.key === "ArrowUp"){ e.preventDefault(); return (list[i - 1] || list[list.length - 1]).focus(); }
    if(e.key === "Home"){ e.preventDefault(); return list[0].focus(); }
    if(e.key === "End"){ e.preventDefault(); return list[list.length - 1].focus(); }
  }

  document.getElementById("menu-root").replaceChildren(menu);
  const r = anchor.getBoundingClientRect();
  menu.style.left = Math.min(r.left, window.innerWidth - menu.offsetWidth - 12) + "px";
  menu.style.top = Math.min(r.bottom + 6, window.innerHeight - menu.offsetHeight - 12) + "px";

  document.addEventListener("keydown", onKey, true);
  document.addEventListener("pointerdown", onOutside, true);
  closeMenu = close;
  const first = items()[0];
  if(first) first.focus();
  say("Actions menu for " + node.label + ". Use the arrow keys, Escape to close.");
}

/* ---------------------------------------------------------------- dialogs */
/* Focus moves in, is trapped while open, Escape closes, and focus returns to
   whatever opened it. This is the pattern the current publish modal is
   missing. */
let closeDialog = null;

function openDialog(build){
  const opener = document.activeElement;
  const root = document.getElementById("dialog-root");

  const panel = el("div", { class:"dialog", role:"dialog", "aria-modal":"true", "aria-labelledby":"dialog-title" });
  const backdrop = el("div", { class:"backdrop", onmousedown: e => { if(e.target === backdrop) close(); } }, panel);

  function close(){
    if(panel._cleanup) panel._cleanup();
    root.replaceChildren();
    document.removeEventListener("keydown", onKey, true);
    closeDialog = null;
    if(opener && opener.focus) opener.focus();
  }
  function onKey(e){
    if(e.key === "Escape"){ e.preventDefault(); close(); return; }
    if(e.key !== "Tab") return;
    const f = panel.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])');
    if(!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }

  build(panel, close);
  root.replaceChildren(backdrop);
  document.addEventListener("keydown", onKey, true);
  closeDialog = close;
  const target = panel.querySelector("button,input,select") || panel;
  target.focus();
}

function openShortcuts(){
  openDialog((panel, close) => {
    const keyRun = b => labelBinding(b).map((k, i) => [i ? " " : "", el("kbd", { text:k })]).flat();
    const fixed = (keys, what) => [
      el("dt", {}, keys.map((k, i) => [i ? " " : "", el("kbd", { text:k })]).flat()),
      el("dd", { text:what })
    ];

    /* A student whose browser has taken a combination has no way to tell
       that apart from the tool being broken. Here they can press it and see:
       if nothing appears, the page never received it. */
    const readout = el("p", { class:"testout", id:"key-readout", "aria-live":"polite" },
      el("em", {}, "Nothing pressed yet."));
    const tester = el("div", {
      class:"keytest", tabindex:"0", role:"group",
      "aria-label":"Test a key combination", "aria-describedby":"key-readout",
      onkeydown: e => {
        if(e.key === "Tab") return;                       // leave a way out
        if(["Shift","Control","Alt","Meta"].includes(e.key)) return;
        e.preventDefault();
        const b = { ctrl:e.ctrlKey, alt:e.altKey, shift:e.shiftKey, meta:e.metaKey };
        if(/^(Key|Digit|Numpad)/.test(e.code || "")) b.code = e.code; else b.key = e.key;
        const hit = ACTIONS.find(a => a.keys.some(x => matchBinding(e, x)));
        readout.replaceChildren(
          el("span", {}, "This page received: "), ...keyRun(b),
          el("span", {}, hit ? "  \u2713 " + hit.label : "  \u2014 not used by this tool")
        );
      }
    }, el("strong", {}, "Press a combination here"),
       el("span", { class:"fineprint" },
         " If nothing shows up below, your browser or another program has taken that combination and this tool will never see it. Use one of the alternatives listed above."));

    panel.append(
      el("h2", { id:"dialog-title", text:"Keyboard shortcuts" }),
      el("p", { style:"color:var(--ink-soft)" },
        "Every action is also in the Actions menu on each idea, so you never need a shortcut for anything. " +
        "Where several keys are listed, any of them works. They are alternatives, not steps."),

      el("h3", { class:"grouplabel", style:"padding-left:0", text:"Moving around" }),
      el("dl", {},
        fixed(["\u2191","\u2193"], "Previous or next idea"),
        fixed(["\u2192"], "Open a closed idea, or move to its first sub-idea"),
        fixed(["\u2190"], "Close an open idea, or move up to its parent"),
        fixed(["Home","End"], "First or last idea on screen"),
        fixed(["Tab"], "Move in and out of the tree"),
        fixed(["Esc"], "Cancel a rename, close a menu, or stop moving an idea")
      ),

      el("h3", { class:"grouplabel", style:"padding-left:0", text:"Working with an idea" }),
      el("ul", { class:"keylist" }, ACTIONS.map(a => el("li", { class:"keyrow" },
        el("span", { class:"keyname" }, a.label),
        el("span", { class:"keyvals" }, a.keys.map((b, i) => [
          i ? el("span", { class:"colorname" }, " or ") : null,
          el("span", {}, keyRun(b))
        ]).flat())
      ))),

      el("h3", { class:"grouplabel", style:"padding-left:0", text:"Moving an idea around the map" }),
      el("dl", {},
        fixed(["\u2191","\u2193","\u2190","\u2192"], "Nudge it, once you have chosen Move this idea from its Actions menu"),
        fixed(["Shift","+ arrow"], "Nudge it in smaller steps"),
        fixed(["Enter"], "Drop it where it is"),
        fixed(["Esc"], "Put it back where it was")
      ),

      el("h3", { class:"grouplabel", style:"padding-left:0", text:"If a shortcut does nothing" }),
      tester,
      readout,

      el("div", { class:"dialog-actions" },
        el("button", { class:"btn", onclick:() => { close(); openAccessibility(); } }, "Accessibility"),
        el("button", { class:"btn btn-primary", onclick:close }, "Close"))
    );
  });
}

const openHelp = openShortcuts;   // older call sites


/* --------------------------------------------------------------- rendering */
function render(){
  if(closeMenu) closeMenu(false);
  if(openMap) renderEditor(); else renderStart();
  if(pendingFocus){
    const target = document.querySelector(pendingFocus);
    pendingFocus = null;
    if(target){
      target.focus();
      if(target.select) try{ target.select(); }catch(e){}
    }
  }
  keepFocusVisible();
}

/* 2.4.11 Focus Not Obscured. The map pans itself so the focused cloud is
   never left off screen or hidden behind the toolbar. MARGIN is a little
   larger than the toolbar so the cloud lands clear of it rather than flush
   against the edge. */
function keepFocusVisible(){
  if(!openMap) return;
  const scroll = document.querySelector(".mapscroll");
  const canvas = scroll && scroll.querySelector(".canvas");
  if(!scroll || !canvas) return;
  const node = scroll.querySelector('.node[data-node-id="' + focusId + '"]')
            || scroll.querySelector(".node.is-current");
  if(!node) return;

  const box = scroll.getBoundingClientRect();
  const n = node.getBoundingClientRect();
  if(!box.width || !n.width) return;          // not laid out yet

  const MARGIN = 56;
  let dx = 0, dy = 0;
  if(n.left   < box.left   + MARGIN) dx = (box.left + MARGIN) - n.left;
  if(n.right  > box.right  - MARGIN) dx = (box.right - MARGIN) - n.right;
  if(n.top    < box.top    + MARGIN) dy = (box.top + MARGIN) - n.top;
  if(n.bottom > box.bottom - MARGIN) dy = (box.bottom - MARGIN) - n.bottom;
  if(!dx && !dy) return;

  panX += dx; panY += dy;
  canvas.style.transform = "translate(" + panX + "px," + panY + "px) scale(" + zoom + ")";
}

document.addEventListener("keydown", e => {
  if(placing && e.key === "Escape"){ e.preventDefault(); return cancelPlacing(); }
  if(closeDialog) return;
  // Deliberately no page-wide "?" shortcut. See ACTIONS: it is bound only on a
  // focused idea, which is the "active only on focus" route through 2.1.4.
});

render();
