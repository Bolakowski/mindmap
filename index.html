<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mind Map (accessible prototype)</title>
<style>
:root{
  --page:#ffffff;
  --ink:#111827;
  --ink-soft:#4b5563;
  --line:#cbd5e1;
  --line-soft:#e2e8f0;
  --surface:#f8fafc;
  --accent:#1d4ed8;
  --accent-ink:#ffffff;
  --focus:#0b3d91;
  --warn-bg:#fdf0c8;
  --warn-border:#a16207;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;
  background:var(--page);
  color:var(--ink);
  font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
h1,h2,h3{line-height:1.25;margin:0}
button,input,select{font:inherit;color:inherit}

/* Focus is never removed, only replaced with something stronger. */
:focus{outline:3px solid var(--focus);outline-offset:2px}
:focus:not(:focus-visible){outline:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* Fixed, not absolute. Positioned against the document, this link sat at the
   top of the page, so once the page had scrolled at all, focusing it sent
   focus somewhere above the visible area. Against the viewport it always
   appears where the user is looking. */
.skip{
  position:fixed;top:0;left:0;z-index:100;
  transform:translateY(-150%);
  background:var(--ink);color:#fff;padding:.6rem 1rem;border-radius:0 0 var(--radius) 0;
}
.skip:focus{transform:translateY(0)}

.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
}

.app{display:flex;flex-direction:column;min-height:100vh}

.topbar{flex:0 0 auto}
header .bar{
  display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;
  padding:.6rem .9rem;border-bottom:1px solid var(--line);background:var(--surface);
}
header .bar h1{font-size:1.05rem;font-weight:650;letter-spacing:-.01em}
.grow{flex:1 1 auto;min-width:0}

.btn{
  background:var(--page);border:1px solid var(--line);border-radius:8px;
  padding:.4rem .7rem;cursor:pointer;
  min-height:24px;min-width:24px;      /* 2.5.8 Target Size (Minimum) */
}
.btn-pan{padding:.25rem;width:28px;height:28px;line-height:1}
.btn:hover{background:var(--surface);border-color:var(--ink-soft)}
.btn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn-primary:hover{background:#173fa8;border-color:#173fa8}
.btn-danger{color:#b91c1c;border-color:#e7b3b3}
.btn-danger:hover{background:#fde2e2}
.btn:disabled{opacity:.5;cursor:not-allowed}

.group{display:flex;gap:.35rem;align-items:center;flex-wrap:wrap}
/* One connected control instead of three separate buttons. */
.seg{gap:0}
.seg .btn{border-radius:0;margin-left:-1px}
.seg .btn:first-child{border-radius:8px 0 0 8px;margin-left:0}
.seg .btn:last-child{border-radius:0 8px 8px 0}
.seg .btn[aria-pressed="true"]{position:relative;z-index:1}
.caret{margin-left:.3rem;font-size:.7em;opacity:.7}
/* The title shares the row rather than pushing everything to a second line. */
#map-title{flex:1 1 8rem;min-width:4rem}
.longword{display:inline}

/* Below a half-screen window the row tightens rather than wrapping: padding
   and gaps shrink, and the longest label drops its prefix. */
@media (max-width:1180px){
  header .bar{gap:.45rem;padding:.55rem .7rem}
  .btn{padding:.35rem .55rem}
  .longword{display:none}
  #map-title{flex:1 1 6rem}
}
.group>.label{font-size:.82rem;color:var(--ink-soft)}

.notice{
  display:flex;gap:.6rem;align-items:flex-start;
  background:var(--warn-bg);border-bottom:1px solid var(--warn-border);
  padding:.55rem .9rem;font-size:.9rem;
}
.notice p{margin:0}

main{flex:1 1 auto;min-height:26rem;display:flex}
main.list{min-height:0}
.pane{min-width:0;overflow:auto;padding:1rem 1.1rem;max-height:calc(100vh - 4rem);min-height:22rem}
.pane-outline{flex:0 0 auto}
.panehead{display:flex;align-items:center;gap:.5rem;margin-bottom:.7rem}
.panehead h2{margin:0}
.panehead .btn{padding:.2rem .5rem;font-size:.82rem}

/* The divider is a real control, not decoration: it can be dragged, and it
   can be operated from the keyboard with the arrow keys, which is what the
   separator role promises a screen reader user. */
.divider{
  flex:0 0 10px;align-self:stretch;position:relative;
  border:0;padding:0;background:var(--line-soft);cursor:col-resize;
}
.divider::before{
  content:"";position:absolute;top:50%;left:50%;
  width:2px;height:34px;transform:translate(-50%,-50%);
  background:var(--ink-soft);border-radius:2px;
}
.divider:hover,.divider:focus-visible{background:var(--line)}
.divider.is-dragging{background:var(--focus)}
.pane+.pane{border-left:1px solid var(--line)}
.pane-outline{flex:0 0 clamp(300px,38%,520px)}

.pane h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-soft);margin-bottom:.7rem}

/* ---------- Outline: this is the real tree ---------- */
ul.tree,ul.tree ul{list-style:none;margin:0;padding:0}
ul.tree ul{margin-left:1.15rem;border-left:1px solid var(--line-soft);padding-left:.55rem}
li.item{margin:.15rem 0}
.row{
  display:flex;align-items:center;gap:.45rem;
  padding:.3rem .5rem;border-radius:8px;border:2px solid transparent;cursor:pointer;
}
.row:hover{background:var(--surface)}
.row.is-current{border-color:var(--focus)}
.twisty{
  flex:0 0 auto;width:24px;height:24px;display:inline-flex;
  align-items:center;justify-content:center;color:var(--ink-soft);
  font-size:.7rem;user-select:none;
}
.chip{
  flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
  width:1.5rem;height:1.5rem;border-radius:6px;border:2px solid;font-size:.8rem;
}
.label{min-width:0;overflow-wrap:break-word}
.colorname{font-size:.72rem;color:var(--ink-soft);white-space:nowrap}
.edit{
  flex:1 1 auto;min-width:0;padding:.15rem .35rem;
  border:2px solid var(--focus);border-radius:6px;background:#fff;
}

/* ---------- Map: a visual rendering of the same tree ---------- */
.mapwrap{position:relative;flex:1 1 auto;min-width:0;display:flex;flex-direction:column;min-height:22rem;max-height:calc(100vh - 4rem)}
.mapbar{
  display:flex;gap:.35rem;align-items:center;flex-wrap:wrap;
  padding:.4rem .7rem;border-bottom:1px solid var(--line-soft);background:var(--page);
}
.mapbar .label{font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-soft)}
.mapscroll{
  flex:1 1 auto;overflow:hidden;position:relative;cursor:grab;
  background:radial-gradient(circle at 1px 1px,var(--line-soft) 1px,transparent 0) 0 0/22px 22px;
}
.mapscroll.is-panning{cursor:grabbing}
.mapscroll.is-placing{cursor:crosshair}
.canvas{position:absolute;left:50%;top:50%;transform-origin:0 0}
.canvas svg{position:absolute;inset:0;overflow:visible;pointer-events:none}
.node{
  position:absolute;transform:translate(-50%,-50%);
  width:max-content;max-width:230px;min-width:5.5rem;
  display:inline-flex;gap:.4rem;align-items:flex-start;
  padding:.5rem .75rem;border:2px solid;border-radius:20px;
  text-align:left;cursor:grab;touch-action:none;
  box-shadow:0 1px 2px rgba(15,23,42,.10);
}
.node.is-root{border-radius:26px;padding:.7rem 1.1rem;font-weight:650;border-width:3px;max-width:260px}
.node.is-leaf{border-radius:999px}
.node.is-current{box-shadow:0 0 0 3px var(--focus),0 1px 2px rgba(15,23,42,.10)}
.node.is-dragging{cursor:grabbing;opacity:.9;z-index:5}
.node.is-moving{outline:3px dashed var(--focus);outline-offset:3px;z-index:5}
.node .glyph{flex:0 0 auto;line-height:1.4}
.node .ntext{min-width:0;overflow-wrap:break-word;word-break:normal;hyphens:auto;font-size:.92rem}
.node .kids{font-size:.72rem;color:var(--ink-soft);white-space:nowrap}
/* Mouse-only shortcuts. Keyboard users have Shift+Enter, Shift+F10 and the
   toolbar, and a treeitem must not contain its own focus stops. */
.node-add,.node-menu,.row-menu{
  border-radius:50%;border:2px solid;background:var(--page);
  align-items:center;justify-content:center;
  font-size:.85rem;line-height:1;cursor:pointer;padding:0;
}
.node-add,.node-menu{position:absolute;width:24px;height:24px;display:none}
.node-add{right:-12px;top:50%;transform:translateY(-50%)}
.node-menu{left:-12px;top:50%;transform:translateY(-50%);font-size:.7rem}
.node:hover .node-add,.node.is-current .node-add,
.node:hover .node-menu,.node.is-current .node-menu{display:inline-flex}
.row-menu{
  flex:0 0 auto;width:24px;height:24px;font-size:.7rem;visibility:hidden;
  border-color:var(--line);color:var(--ink-soft);display:inline-flex;
}
.row:hover .row-menu,.row.is-current .row-menu{visibility:visible}

.map-edit{
  position:absolute;transform:translate(-50%,-50%);z-index:6;
  border:2px solid var(--focus);border-radius:20px;background:#fff;
  padding:.5rem .75rem;width:190px;font:inherit;font-size:.92rem;
}

.menu{
  position:fixed;z-index:60;min-width:15rem;
  background:var(--page);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 8px 28px rgba(15,23,42,.20);padding:.3rem;
}
.menu button{
  display:flex;align-items:center;gap:.55rem;width:100%;
  background:none;border:0;border-radius:7px;padding:.42rem .6rem;
  text-align:left;cursor:pointer;
}
.menu button:hover:not(:disabled){background:var(--surface)}
.menu button:disabled{opacity:.45;cursor:not-allowed}
.menu button .keys{margin-left:auto;color:var(--ink-soft);font-size:.78rem;white-space:nowrap}
.menu hr{border:0;border-top:1px solid var(--line-soft);margin:.3rem .2rem}
.menu .grouplabel{
  padding:.35rem .6rem .15rem;font-size:.72rem;text-transform:uppercase;
  letter-spacing:.08em;color:var(--ink-soft);
}
.menu .swatch{
  flex:0 0 auto;width:1.15rem;height:1.15rem;border-radius:5px;border:2px solid;
  display:inline-flex;align-items:center;justify-content:center;font-size:.65rem;
}
.menu .tick{margin-left:auto}

/* ---------- Maps list ---------- */
.list{display:block;max-width:60rem;margin:0 auto;padding:1.5rem 1.1rem;width:100%}
.maplist{list-style:none;margin:1rem 0 0;padding:0;display:grid;gap:.6rem}
.maprow{
  display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;
  border:1px solid var(--line);border-radius:var(--radius);padding:.7rem .85rem;
}
.maprow .meta{font-size:.82rem;color:var(--ink-soft)}
.empty{border:2px dashed var(--line);border-radius:var(--radius);padding:1.5rem;text-align:center;color:var(--ink-soft)}
.list h2.lede{font-size:1.35rem;font-weight:600;letter-spacing:-.01em;margin-bottom:1.2rem;max-width:38rem}
.cta{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1.6rem}
.btn-big{padding:.7rem 1.15rem;font-size:1.02rem;border-radius:10px}
.card{border:1px solid var(--line);border-radius:12px;padding:1rem 1.15rem;margin-bottom:1rem}
.card h3{font-size:1rem;margin-bottom:.4rem}
.card p{margin:.35rem 0;color:var(--ink-soft)}
.card-recover{border-color:var(--warn-border);background:var(--warn-bg)}
.card-recover p{color:var(--ink)}
.card-legacy{border-color:#e7b3b3;background:#fde2e2}
.card-legacy p{color:var(--ink)}
.cardactions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.7rem}
ol.steps{list-style:none;margin:.6rem 0 0;padding:0;display:grid;gap:.7rem}
.step{display:flex;gap:.75rem;align-items:flex-start}
.stepnum{
  flex:0 0 auto;width:1.6rem;height:1.6rem;border-radius:50%;
  background:var(--ink);color:#fff;display:inline-flex;
  align-items:center;justify-content:center;font-size:.82rem;font-weight:650;
}
.step h3{font-size:.95rem;margin-bottom:.1rem}
.step p{margin:0;color:var(--ink-soft);font-size:.93rem}
.fineprint{font-size:.85rem;color:var(--ink-soft);margin-top:.8rem}
ul.plainlist{margin:.2rem 0 .6rem;padding-left:1.1rem;color:var(--ink-soft)}
ul.plainlist li{margin:.3rem 0}
.notice-ok{background:#d5f5e3;border-bottom-color:#15803d}
.dot{
  display:inline-block;width:.5rem;height:.5rem;border-radius:50%;
  background:#b91c1c;margin-left:.4rem;vertical-align:middle;
}

/* ---------- Dialog ---------- */
.backdrop{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:50}
.dialog{background:var(--page);border-radius:14px;max-width:36rem;width:100%;max-height:85vh;overflow:auto;padding:1.2rem 1.3rem;border:1px solid var(--line)}
.dialog h2{font-size:1.1rem;margin-bottom:.6rem}
.dialog dl{display:grid;grid-template-columns:auto 1fr;gap:.35rem .9rem;margin:.8rem 0}
.dialog dt{font-weight:600;white-space:nowrap}
.dialog dd{margin:0;color:var(--ink-soft)}
kbd{
  font:inherit;font-size:.85em;background:var(--surface);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:5px;padding:.05em .35em;
}
.dialog-actions{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1rem;flex-wrap:wrap}
.dialog h3{font-size:.78rem;margin:1.1rem 0 .3rem}
ul.keylist{list-style:none;margin:.3rem 0 0;padding:0;display:grid;gap:.35rem}
.keyrow{
  display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;
  border:1px solid var(--line-soft);border-radius:9px;padding:.45rem .6rem;
}
.keyname{flex:1 1 11rem;min-width:0}
.keyvals{flex:0 1 auto;min-width:0}
.keyrow .btn{padding:.25rem .55rem;font-size:.85rem}
.keytest{
  display:block;border:2px dashed var(--line);border-radius:10px;
  padding:.8rem .9rem;margin:.4rem 0 .5rem;background:var(--surface);cursor:text;
}
.keytest:focus{border-style:solid;background:var(--page)}
.keytest .fineprint{display:block;margin-top:.3rem}
.testout{
  margin:0 0 .4rem;padding:.5rem .7rem;border-radius:8px;
  background:var(--surface);border:1px solid var(--line-soft);min-height:2.4rem;
}

@media (max-width:1000px){
  main{flex-direction:column;min-height:0}
  .mapwrap{border-top:1px solid var(--line)}
  .pane,.mapwrap{max-height:none}
  .pane-outline{flex-basis:auto !important}
  .divider{display:none}
  .mapwrap{min-height:70vh}
  .pane-outline{flex:0 0 auto;min-height:0}
}
/* Very high zoom or a very narrow window: let everything breathe vertically
   and rely on normal page scrolling rather than nested scroll areas. */
@media (max-width:560px){
  header .bar{gap:.4rem;padding:.5rem .6rem}
  .btn{padding:.35rem .55rem;font-size:.92rem}
  .mapwrap{min-height:80vh}
}
@media (prefers-reduced-motion:no-preference){
  .row,.node,.btn{transition:background-color .12s ease,border-color .12s ease}
}
/* A dedicated print view, built fresh at print time. Printing the live map
   would mean printing a panned, zoomed, clipped viewport; this renders the
   whole map at its natural size instead and scales it to the page. */
#print-root{display:none}
@media print{
  body > *{display:none !important}
  body > #print-root{display:block !important}
  body{font-size:11pt;background:#fff}
  @page{margin:0.6in}
  .print-head{border-bottom:2px solid #111827;padding-bottom:.4rem;margin-bottom:1rem}
  .print-head h1{font-size:18pt;margin:0 0 .2rem}
  .print-head .meta{font-size:10pt;color:#374151}
  .print-mapwrap{page-break-inside:avoid;margin-bottom:.6rem}
  .print-canvas{position:relative;transform-origin:0 0}
  .print-node{
    position:absolute;transform:translate(-50%,-50%);
    width:max-content;max-width:230px;min-width:5.5rem;
    display:inline-flex;gap:.4rem;align-items:flex-start;
    padding:.5rem .75rem;border:2px solid;border-radius:20px;font-size:10pt;
  }
  .print-outline{page-break-inside:auto;margin-top:1.2rem;padding-top:.8rem;border-top:1px solid #cbd5e1}
  .print-outline h2{font-size:14pt;margin:0 0 .5rem}
  .print-outline ul{list-style:none;margin:0;padding:0}
  .print-outline ul ul{margin-left:1rem;border-left:1px solid #cbd5e1;padding-left:.6rem}
  .print-outline li{margin:.18rem 0}
  .print-row{display:flex;gap:.4rem;align-items:baseline}
  .print-chip{
    flex:0 0 auto;width:1.1rem;height:1.1rem;border:2px solid;border-radius:4px;
    display:inline-flex;align-items:center;justify-content:center;font-size:7pt;
  }
  .print-colorname{font-size:8pt;color:#4b5563}
}
</style>
</head>
<body>
<a class="skip" href="#work">Skip to the map</a>
<div class="app" id="app"></div>
<div id="dialog-root"></div>
<div id="menu-root"></div>
<div id="print-root"></div>
<p class="sr-only" id="live" role="status" aria-live="polite"></p>

<script>
"use strict";

/* ==========================================================================
   Mind Map, accessible prototype
   --------------------------------------------------------------------------
   The point of this file is the DATA MODEL, not the drawing.

   Every node stores parentId and order. The tree is authored, never guessed
   from where boxes happen to sit on screen. Position is computed from the
   tree at render time, so the visual layout can never disagree with the
   reading order a screen reader gets.

   The outline is the real interactive tree (ARIA tree pattern). The map is a
   synchronised picture of it. Whichever pane is showing is the one that
   carries the tree semantics; the other is hidden from assistive tech so
   nothing is announced twice.
   ========================================================================== */

/* ---------------------------------------------------------------- palette */
/* Fills are light and text is near-black, so every combination clears 14:1.
   Borders clear 4.3:1 against their own fill, well past the 3:1 needed for
   non-text contrast. Each color also carries a distinct glyph and a spoken
   name, so color is never the only thing distinguishing two nodes. */
const COLORS = [
  { id:"slate",  name:"Slate",  fill:"#e5e9f0", line:"#475569", glyph:"\u25A0" },
  { id:"blue",   name:"Blue",   fill:"#dbeafe", line:"#1d4ed8", glyph:"\u25CF" },
  { id:"green",  name:"Green",  fill:"#d5f5e3", line:"#15803d", glyph:"\u25B2" },
  { id:"amber",  name:"Amber",  fill:"#fdf0c8", line:"#a16207", glyph:"\u25C6" },
  { id:"red",    name:"Red",    fill:"#fde2e2", line:"#b91c1c", glyph:"\u2716" },
  { id:"purple", name:"Purple", fill:"#e9e2fb", line:"#6d28d9", glyph:"\u2605" },
  { id:"teal",   name:"Teal",   fill:"#cdf3ee", line:"#0f766e", glyph:"\u25AC" },
  { id:"pink",   name:"Pink",   fill:"#fbe0ee", line:"#be185d", glyph:"\u2726" }
];
const colorOf = id => COLORS.find(c => c.id === id) || COLORS[0];

/* ------------------------------------------------------------- persistence */
/* Work lives in FILES, the way a document does. The browser holds nothing
   permanent.

   The one exception is a recovery copy in sessionStorage, chosen over
   localStorage on purpose: sessionStorage belongs to the browser tab, so it
   is destroyed the moment the tab closes and is invisible to any other tab.
   The next student to sit down opens a new tab and gets nothing. That is the
   only storage design where "nothing is left behind" is guaranteed by the
   browser rather than by remembering to press a button.

   The honest limit: because the copy dies with the tab, it covers an
   accidental reload or a wrong click, not a full browser crash. Trading
   crash recovery for leaving no trace on a shared machine is the right way
   round for a classroom. */
const RECOVER_KEY = "a11y-mindmap:working";
const LEGACY_KEY = "a11y-mindmap:v1";     // maps left behind by earlier versions
const uid = () => "n" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

function readRecovery(){
  try{
    const raw = sessionStorage.getItem(RECOVER_KEY);
    return raw ? migrate(JSON.parse(raw)) : null;
  }catch(e){ return null; }
}
function writeRecovery(map){
  try{ sessionStorage.setItem(RECOVER_KEY, JSON.stringify(map)); return true; }
  catch(e){ return false; }
}
function clearRecovery(){
  try{ sessionStorage.removeItem(RECOVER_KEY); }catch(e){}
}
/* Anything an earlier build left in localStorage is surfaced on the start
   screen so it can be saved or deleted, never silently kept. */
function readLegacy(){
  try{
    const raw = localStorage.getItem(LEGACY_KEY);
    const parsed = raw ? JSON.parse(raw) : null;
    return Array.isArray(parsed) ? parsed.map(migrate) : [];
  }catch(e){ return []; }
}
function clearLegacy(){
  try{ localStorage.removeItem(LEGACY_KEY); }catch(e){}
}

/* Older saves kept a title separate from the central idea. Carry the title
   across only when the central idea was never renamed, so nobody loses the
   name they typed, then drop the field for good. */
function migrate(map){
  if(map && map.title){
    const root = map.nodes && map.nodes[map.rootId];
    if(root && (root.label === "Central idea" || root.label === "Untitled map" || !root.label)){
      root.label = map.title;
    }
    delete map.title;
  }
  return map;
}

/* ------------------------------------------------------------- data model */
function newMap(title){
  const rootId = uid();
  return {
    id: uid(),
    createdAt: Date.now(),
    updatedAt: Date.now(),
    rootId,
    nodes: {
      [rootId]: { id: rootId, label: title || "Central idea", parentId: null, order: 0, color: "slate", collapsed: false }
    }
  };
}
/* The central idea IS the map's name. One field, not two that drift apart. */
const titleOf = map => {
  const root = map.nodes[map.rootId];
  return (root && root.label) || "Untitled map";
};

const childrenOf = (map, id) =>
  Object.values(map.nodes)
    .filter(n => n.parentId === id)
    .sort((a, b) => a.order - b.order || a.id.localeCompare(b.id));

function depthOf(map, id){
  let d = 0, cur = map.nodes[id];
  while(cur && cur.parentId){ d++; cur = map.nodes[cur.parentId]; }
  return d;
}
/* Depth-first list of everything currently on screen, which is also the
   order a screen reader will read. One list drives both panes. */
function visibleList(map){
  const out = [];
  (function walk(id){
    const node = map.nodes[id];
    if(!node) return;
    out.push(node);
    if(!node.collapsed) childrenOf(map, id).forEach(c => walk(c.id));
  })(map.rootId);
  return out;
}
function descendants(map, id){
  const out = [];
  (function walk(pid){ childrenOf(map, pid).forEach(c => { out.push(c); walk(c.id); }); })(id);
  return out;
}
function resequence(map, parentId){
  childrenOf(map, parentId).forEach((c, i) => { c.order = i; });
}
function addChild(map, parentId, label){
  const parent = map.nodes[parentId];
  if(!parent) return null;
  const node = {
    id: uid(),
    label: label || "New idea",
    parentId,
    order: childrenOf(map, parentId).length,
    color: parent.parentId ? parent.color : "blue",
    collapsed: false
  };
  map.nodes[node.id] = node;
  parent.collapsed = false;
  return node;
}
function removeNode(map, id){
  if(id === map.rootId) return 0;
  const doomed = [id, ...descendants(map, id).map(n => n.id)];
  const parentId = map.nodes[id].parentId;
  doomed.forEach(d => { delete map.nodes[d]; });
  resequence(map, parentId);
  return doomed.length;
}

/* ------------------------------------------------------------ tree layout */
/* Every node stores its own absolute x and y, and once a node has a position
   it keeps it. Nothing already on the map moves because something else was
   added.

   The earlier version computed all positions from the tree on every render:
   the circle was carved into wedges sized by how many leaves each branch
   held. That is tidy on paper and unusable in practice, because adding one
   idea changes the leaf counts above it, which resizes every wedge, which
   moves every node on screen. Anything the student had arranged by hand was
   offset from a base that had just shifted underneath it, so each new idea
   scattered the map a little further.

   So positions are data now, like labels and colors. New ideas are placed
   into free space near their parent; everything else is left alone. Nothing
   rearranges the whole map, and a single branch only moves when its own menu
   is used to ask for it.

   None of this affects reading order. Structure still lives in parentId and
   order, so a screen reader walks the tree and never looks at coordinates. */
const CHILD_R = 215;                // how far a new idea sits from its parent
const HALF_W = 105, HALF_H = 34;    // generous box, used only to size the canvas
const PAD = 40;
const RADII = [0, 240, 430, 600, 750];
const radiusAt = d => d < RADII.length ? RADII[d] : RADII[RADII.length - 1] + 150 * (d - RADII.length + 1);

/* The tidy radial arrangement, used to lay out a map that has no positions
   yet. Existing positions are never recomputed from it. */
function radialLayout(map){
  const base = {};
  const leafCount = id => {
    const kids = childrenOf(map, id);
    if(!kids.length) return 1;
    return kids.reduce((s, c) => s + leafCount(c.id), 0);
  };
  (function place(id, a0, a1, depth){
    const angle = (a0 + a1) / 2, r = radiusAt(depth);
    base[id] = { x: Math.cos(angle) * r, y: Math.sin(angle) * r };
    const kids = childrenOf(map, id);
    if(!kids.length) return;
    const total = kids.reduce((s, c) => s + leafCount(c.id), 0) || 1;
    let a = a0;
    kids.forEach(c => {
      const share = (a1 - a0) * (leafCount(c.id) / total);
      const inset = Math.min(share * 0.12, 0.12);   // a little air between wedges
      place(c.id, a + inset, a + share - inset, depth + 1);
      a += share;
    });
  })(map.rootId, -Math.PI / 2, Math.PI * 1.5, 0);
  return base;
}

/* Place one new idea near its parent, in the emptiest direction available and
   pointing away from the grandparent, then push it out if it landed on top of
   something. Nothing else on the map is touched. */
function placeNear(map, node){
  const parent = map.nodes[node.parentId];
  if(!parent){ node.x = 0; node.y = 0; return; }
  if(typeof parent.x !== "number") placeNear(map, parent);

  const taken = [];
  const gp = parent.parentId ? map.nodes[parent.parentId] : null;
  if(gp && typeof gp.x === "number") taken.push(Math.atan2(gp.y - parent.y, gp.x - parent.x));
  childrenOf(map, parent.id).forEach(c => {
    if(c.id !== node.id && typeof c.x === "number") taken.push(Math.atan2(c.y - parent.y, c.x - parent.x));
  });

  let angle;
  if(!taken.length){
    angle = 0;                                   // first child of the root: to the right
  }else{
    // Widest gap between the directions already in use.
    const sorted = taken.slice().sort((a, b) => a - b);
    let best = 0, bestGap = -1;
    for(let i = 0; i < sorted.length; i++){
      const a = sorted[i];
      const b = (i + 1 < sorted.length) ? sorted[i + 1] : sorted[0] + Math.PI * 2;
      const gap = b - a;
      if(gap > bestGap){ bestGap = gap; best = a + gap / 2; }
    }
    angle = best;
  }

  const others = Object.values(map.nodes).filter(n => n.id !== node.id && typeof n.x === "number");
  const clashes = (x, y) => others.some(o => Math.abs(o.x - x) < 150 && Math.abs(o.y - y) < 54);
  for(let attempt = 0; attempt < 12; attempt++){
    // Widen the search: further out, then fanned slightly to each side.
    const r = CHILD_R + Math.floor(attempt / 3) * 70;
    const spread = [0, 0.42, -0.42][attempt % 3];
    const x = parent.x + Math.cos(angle + spread) * r;
    const y = parent.y + Math.sin(angle + spread) * r;
    if(!clashes(x, y) || attempt === 11){ node.x = x; node.y = y; return; }
  }
}

/* Files from the previous version carried nudges (dx, dy) instead of
   positions. Fold those in once, then never again. */
function ensurePositions(map){
  const all = Object.values(map.nodes);
  const missing = all.filter(n => typeof n.x !== "number" || typeof n.y !== "number");
  if(!missing.length) return;

  if(missing.length === all.length){
    const base = radialLayout(map);
    (function apply(id, ox, oy){
      const n = map.nodes[id];
      const dx = ox + (n.dx || 0), dy = oy + (n.dy || 0);
      n.x = base[id].x + dx;
      n.y = base[id].y + dy;
      delete n.dx; delete n.dy;
      childrenOf(map, id).forEach(c => apply(c.id, dx, dy));
    })(map.rootId, 0, 0);
    return;
  }
  // Just a few new ideas: place each one, leaving the rest of the map alone.
  missing.forEach(n => placeNear(map, n));
}

/* There is deliberately nothing that re-arranges a map, or part of one, after
   it has been laid out. Any such button destroys work the student did by
   hand, and with no undo a mis-click is unrecoverable. It also cannot be
   described honestly: "tidy" suggests a small improvement, while what the
   code does is throw the positions away and compute new ones. Someone who
   dislikes where an idea sits drags it, or moves it with the arrow keys,
   which leaves them in charge of where it ends up. */

/* Move an idea and its whole branch by the same amount, so the branch keeps
   its shape. */
function shiftBranch(map, id, dx, dy){
  [map.nodes[id], ...descendants(map, id)].forEach(n => { n.x += dx; n.y += dy; });
}

function layout(map){
  ensurePositions(map);
  const pos = {};
  visibleList(map).forEach(n => { pos[n.id] = { x: n.x, y: n.y }; });

  // Coordinates can be negative; the canvas is panned with a transform rather
  // than normalized, so a move that shifts everything equally still shows.
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  Object.values(pos).forEach(p => {
    minX = Math.min(minX, p.x - HALF_W); maxX = Math.max(maxX, p.x + HALF_W);
    minY = Math.min(minY, p.y - HALF_H); maxY = Math.max(maxY, p.y + HALF_H);
  });
  return {
    pos,
    minX: minX - PAD, minY: minY - PAD,
    width: maxX - minX + PAD * 2,
    height: maxY - minY + PAD * 2
  };
}

/* ------------------------------------------------------------ tiny helpers */
function el(tag, props, ...kids){
  const node = document.createElement(tag);
  for(const [k, v] of Object.entries(props || {})){
    if(v === null || v === undefined || v === false) continue;
    if(k === "class") node.className = v;
    else if(k === "text") node.textContent = v;
    else if(k === "html") node.innerHTML = v;
    else if(k.startsWith("on")) node.addEventListener(k.slice(2).toLowerCase(), v);
    else if(k === "style") node.setAttribute("style", v);
    else node.setAttribute(k, v === true ? "" : String(v));
  }
  kids.flat().forEach(c => { if(c !== null && c !== undefined && c !== false) node.append(c); });
  return node;
}
const fmtDate = ts => new Date(ts).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });

/* Every node's spoken name says the same three things in the same order,
   so a listener can predict the shape of what they are about to hear. */
function accessibleName(map, node){
  const kids = childrenOf(map, node.id).length;
  const parts = [node.label, colorOf(node.color).name];
  if(node.id === map.rootId) parts.push("central idea");
  parts.push(kids === 0 ? "no sub-ideas" : kids === 1 ? "1 sub-idea" : kids + " sub-ideas");
  return parts.join(", ");
}

/* --------------------------------------------------------------- divider */
function renderDivider(){
  const bar = el("div", {
    class:"divider",
    role:"separator", "aria-orientation":"vertical",
    "aria-label":"Outline width. Use the left and right arrow keys to resize.",
    "aria-valuenow": outlineW, "aria-valuemin": MIN_W, "aria-valuemax": MAX_W,
    tabindex:"0",
    onkeydown: e => {
      const step = e.shiftKey ? 8 : 40;
      if(e.key === "ArrowLeft"){ e.preventDefault(); setOutlineW(outlineW - step); pendingFocus = ".divider"; render(); }
      else if(e.key === "ArrowRight"){ e.preventDefault(); setOutlineW(outlineW + step); pendingFocus = ".divider"; render(); }
      else if(e.key === "Home"){ e.preventDefault(); setOutlineW(MIN_W); pendingFocus = ".divider"; render(); }
      else if(e.key === "End"){ e.preventDefault(); setOutlineW(MAX_W); pendingFocus = ".divider"; render(); }
      else if(e.key === "Enter" || e.key === " "){ e.preventDefault(); hideOutline(); }
    },
    ondblclick: () => hideOutline(),
    onpointerdown: e => {
      if(e.button !== 0 && e.pointerType === "mouse") return;
      e.preventDefault();
      const pane = document.querySelector(".pane-outline");
      const left = pane.getBoundingClientRect().left;
      bar.classList.add("is-dragging");
      const onMove = ev => {
        // Style the pane directly while dragging; a full render per pixel
        // would be wasteful and would fight the pointer.
        const w = Math.min(MAX_W, Math.max(MIN_W, ev.clientX - left));
        pane.style.flexBasis = w + "px";
        bar.setAttribute("aria-valuenow", String(Math.round(w)));
      };
      const onUp = ev => {
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", onUp);
        window.removeEventListener("pointercancel", onUp);
        bar.classList.remove("is-dragging");
        setOutlineW(ev.clientX - left, true);
        render();
      };
      window.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
      window.addEventListener("pointercancel", onUp);
    }
  });
  return bar;
}
